[project]
name = "spij-mcp"
version = "0.6.2"
description = "MCP local para buscar y leer el SPIJ (Sistema Peruano de Informacion Juridica). No oficial."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.28,<2",
    "httpx>=0.27",
]

[project.scripts]
spij-mcp = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
package = true
